[project]
name = "agentfit-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "pydantic", "pypdf", "reportlab", "jsonschema", "python-dotenv"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
